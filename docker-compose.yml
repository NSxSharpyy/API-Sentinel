
services:
  seed:
    build: ./appsec-testing/services/billing_service
    container_name: api-sentinel-seed
    environment:
      DB_PATH: /app/data/shop.db
    volumes:
      - shop-data:/app/data
    entrypoint: ["python", "/app/seed_db.py"]
    restart: "no"

  auth:
    build: ./appsec-testing/services/auth_service
    container_name: api-sentinel-auth
    environment:
      HOST: "0.0.0.0"
      PORT: "5001"
      TOKEN_SECRET: "${TOKEN_SECRET:?Set TOKEN_SECRET in the root .env file}"
      DB_PATH: /app/data/shop.db
    volumes:
      - shop-data:/app/data
    depends_on:
      seed:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:5001:5001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5001/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  user:
    build: ./appsec-testing/services/user_service
    container_name: api-sentinel-user
    environment:
      HOST: "0.0.0.0"
      PORT: "5002"
      TOKEN_SECRET: "${TOKEN_SECRET:?Set TOKEN_SECRET in the root .env file}"
      DB_PATH: /app/data/shop.db
    volumes:
      - shop-data:/app/data
    depends_on:
      seed:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:5002:5002"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5002/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  order:
    build: ./appsec-testing/services/order_service
    container_name: api-sentinel-order
    environment:
      HOST: "0.0.0.0"
      PORT: "5003"
      TOKEN_SECRET: "${TOKEN_SECRET:?Set TOKEN_SECRET in the root .env file}"
      DB_PATH: /app/data/shop.db
    volumes:
      - shop-data:/app/data
    depends_on:
      seed:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:5003:5003"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5003/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  billing:
    build: ./appsec-testing/services/billing_service
    container_name: api-sentinel-billing
    environment:
      HOST: "0.0.0.0"
      PORT: "5004"
      TOKEN_SECRET: "${TOKEN_SECRET:?Set TOKEN_SECRET in the root .env file}"
      DB_PATH: /app/data/shop.db
    volumes:
      - shop-data:/app/data
    depends_on:
      seed:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:5004:5004"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5004/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  shop-data:

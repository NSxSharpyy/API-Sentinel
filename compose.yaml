services:
  api:
    build:
      context: .
      dockerfile: Dockerfile

    image: api-sentinel-backend:day29
    container_name: api-sentinel-api
    init: true

    ports:
      - "127.0.0.1:8001:8001"

    environment:
      API_SENTINEL_CAPTURE_ENABLED: "0"
      API_SENTINEL_BLOCKLIST_DROP_AUDIT_ENABLED: "0"
      API_SENTINEL_BLOCKLIST_SYNC_ENABLED: "0"
      API_SENTINEL_BLOCKLIST_POLICY_ENABLED: "0"

      DATABASE_URL: "sqlite:////data/api_sentinel.db"
      ASYNC_DATABASE_URL: "sqlite+aiosqlite:////data/api_sentinel.db"

    volumes:
      - api_sentinel_data:/data

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/readyz', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    restart: unless-stopped

volumes:
  api_sentinel_data:
